<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Modern To Do</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>To Do 4</h1>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
      </header>

      <section class="card">
        <form id="todoForm" class="todo-form" autocomplete="off">
          <input id="todoInput" class="todo-input" placeholder="What needs to be done?" />
          <button class="add-btn" aria-label="Add">Add</button>
        </form>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>

        <footer class="card-footer">
          <div class="left">
            <span id="itemsLeft" class="items-left">0 items left</span>
          </div>
          <div class="filters">
            <button data-filter="all" class="filter-btn active">All</button>
            <button data-filter="active" class="filter-btn">Active</button>
            <button data-filter="completed" class="filter-btn">Completed</button>
          </div>
          <div class="right">
            <button id="clearCompleted" class="clear-btn">Clear completed</button>
          </div>
        </footer>
      </section>

    </main>

    <script src="app.js" defer></script>
  </body>
</html>
